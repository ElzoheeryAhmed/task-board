name: taskboard-CI
run-name: taskboard-CIRun

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  prebuildscan:
    name: Pre-build scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed by Gitleaks and SonarQube

      - name: Gitleaks (secrets)
        uses: ./.github/actions/gitleaks

      - name: SonarQube (code quality + SAST)
        uses: ./.github/actions/sonarqube
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN}}
          

      - name: Trivy (dependencies, secrets, k8s manifests)
        uses: ./.github/actions/trivy
        with:
          scan-type: fs
          target: .
          report-name: trivy-fs

  # ---------- 2. Build images (only runs if the pre-build scan passed) ----------
  build:
    name: Build ${{ matrix.service }}
    needs: prebuildscan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, database]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          tags: taskboard-${{ matrix.service }}:${{ github.sha }}
          outputs: type=docker,dest=${{ matrix.service }}.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar
          retention-days: 1

  # ---------- 3. Scan the built images ----------
  postbuildscan:
    name: Post-build scan ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, database]
    steps:
      - uses: actions/checkout@v4

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}

      - name: Trivy (container image)
        uses: ./.github/actions/trivy
        with:
          scan-type: image
          target: ${{ matrix.service }}.tar
          report-name: trivy-image-${{ matrix.service }}