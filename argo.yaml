apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ElzoheeryAhmed/task-board.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc  #kubernetes is default name of svc when i install ArgoCD
    namespace: default
  syncPolicy:
    automated:
      prune: true      # remove what removed from git
      selfHeal: true   # revert manual changes in the cluster which not in the git Repo
    syncOptions:
      - CreateNamespace=true