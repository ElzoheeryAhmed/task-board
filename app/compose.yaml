services:
  frontend:
    build: ./app/frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
  
  backend:
    build: ./app/backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: mydb
      DB_USER: user
      DB_PASSWORD: pass
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
   

  db:
    build: ./app/database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      retries: 5  

volumes:
  pgdata: